
# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position           = "top"          # top | bottom | left | right
thickness          = 20
background_opacity = 1.0
radius             = 12
margin_ends        = 0
margin_edge        = 0
padding            = 10
widget_spacing     = 10
scale              = 1.0
shadow             = false
auto_hide          = false
smart_auto_hide    = false       # show when the active workspace is empty; hide when it has windows
# show_on_workspace_switch = true   # with auto_hide: briefly reveal when the active workspace changes
reserve_space      = true
# capsule          = true
# capsule_fill     = "surface_variant"
# capsule_radius   = 8.0            # omit/blank in Settings for automatic pill radius; 0.0 = square
# capsule_opacity  = 1.0
# capsule_border   = "outline"      # uncomment for a border on all widgets

start  = ["launcher", "wallpaper", "workspaces", "tray"]
center = ["clock"]
end    = ["notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

# Commands for the bar margin outside widget sections (dead zone):
# [bar.main.dead_zone.actions]
# left = "panel-toggle launcher"
# right = "panel-toggle control-center"
# middle = "none"
# scroll_up = "none"
# scroll_down = "none"

# Per-monitor override example — only the fields you list are overridden:
# [bar.main.monitor.dp1]
# match     = "DP-1"
# thickness = 44
# [bar.main.monitor.dp1.dead_zone.actions]
# left = "panel-toggle launcher"

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
enabled             = false         # set true to activate
position            = "bottom"      # top | bottom | left | right
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
radius              = 16
radius_top_left     = 16
radius_top_right    = 16
radius_bottom_left  = 16
radius_bottom_right = 16
margin_ends         = 0
margin_edge         = 8
shadow              = true
show_running        = true
auto_hide           = false
# smart_auto_hide   = false       # show when the active workspace is empty; hide when it has windows
reserve_space       = true
layer               = "top"         # top | overlay
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
show_dots           = false
show_instance_count = true
launcher_position   = "none"       # none | start | end
launcher_icon       = "grid-dots"  # Tabler glyph name
active_monitor_only = false
pinned              = []            # e.g. ["firefox", "code", "kitty"]




